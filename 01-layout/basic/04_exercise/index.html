<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link type="text/css" rel="stylesheet" href="mystyle.scss" />
    <title>Ejercicio 4: Crearemos un elemento de tipo card con Grid CSS.</title>
  </head>
  <body>
    <div class="page">
      <article class="card">
        <img
          class="image"
          src="./assets/macbook.webp"
          alt="Imagen de prueba"
        />
        <div class="content">
          <h2 class="title">Title</h2>
          <p class="text">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Ipsam
            deleniti enim aliquam blanditiis quod quasi nesciunt. Sed natus
            cupiditate fuga repellendus, commodi ipsum nostrum quae, nobis
            veritatis amet est cumque.
          </p>
          <p class="meta">
            <span class="label">Published:</span>
            <span class="date">March 20, 2020</span>
          </p>
        </div>
        <button class="button">More info</button>
      </article>
    </div>
  </body>
</html>
